<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Word Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <h1>Guess the Word Game</h1>
        <div id="hiddenWord" class="word-display"></div>
        <input type="text" id="guessInput" class="input-guess" maxlength="1" placeholder="Nhập một chữ cái">
        <button class="btn-guess" onclick="guessLetter()">Đoán</button>
        <div id="message" class="message-display"></div>
        <div id="character"></div>
        <div id="obstacle"></div>
    </div>
 
    <script src="js/script.js"></script>
</body>
</html>
